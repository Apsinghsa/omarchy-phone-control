# Keep the scrcpy control-mode window out of the way.
#
# scrcpy's control-only mode renders an empty window, but that window must stay
# mapped and focusable — it is the surface that captures the mouse and receives
# the shortcut-mod key that releases it back to the PC. So we do NOT hide or
# unmap it; we shrink it and make it nearly transparent, pinned to a corner.
#
# Add to your Hyprland config (~/.config/hypr/hyprland.conf):
#
#   source = ~/.config/omarchy/plugins/apsingh.phone/hypr/scrcpy-control.conf
#
# Omarchy Quattro parses the Lua config. The rules below are plain Hyprland
# syntax and work unchanged; only the runtime monitor/window API differs.

# Tiny, transparent, decoration-free, pinned top-right just under the bar.
windowrule {
  match:class scrcpy
  geometry "940x40"
  float
  noborder
  noanim
  opacity 0.04 override
  rounding 0
}

# Keep it out of focus stealing and never let it tile with real windows.
windowrule {
  match:class scrcpy
  suppressevent maximize
  suppressevent fullscreen
}

# The mouse must be able to reach it, so leave the position alone once pinned.
# If the 940x40 box sits where you do not want it, change the geometry x offset
# (940 = right edge minus width on a 1920-wide display; scale to your output).
